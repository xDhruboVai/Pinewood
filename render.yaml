services:
  - type: web
    name: pinewood-backend
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm run build --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_EMAIL_FUNCTION_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
